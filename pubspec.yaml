name: ai_mock_interviewer
description: AI Based Mock Interviewer
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.4
  cloud_firestore: ^5.6.2
  google_sign_in: ^6.2.2

  # AI & Voice
  http: ^1.3.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.2

  # Camera
  camera: ^0.11.1
  # UI & Animations
  fl_chart: ^0.66.2
  animate_do: ^3.3.4
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # State Management
  provider: ^6.1.2
  flutter_dotenv: ^5.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  shared_preferences: ^2.3.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/